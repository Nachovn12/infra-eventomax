name: eventomax-kafka-admin-prod

services:
  kafka-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventomax/kafka-admin:latest
    container_name: eventomax-kafka-admin
    restart: unless-stopped
    ports:
      - "${KAFKA_ADMIN_PORT:-8088}:8088"
    environment:
      SERVER_PORT: 8088
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}"
      ENTRA_ISSUER_URI: "${ENTRA_ISSUER_URI:?ENTRA_ISSUER_URI is required}"
      ENTRA_AUDIENCE: "${ENTRA_AUDIENCE:?ENTRA_AUDIENCE is required}"
    networks:
      - eventomax-net

networks:
  eventomax-net:
    name: eventomax-net
    external: true

