name: Infra & Rabbit Admin CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify Rabbit Admin (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run verification test suite
        working-directory: rabbit-admin
        run: mvn -B -ntp verify

      - name: Build Docker container
        working-directory: rabbit-admin
        run: docker build -t eventomax-rabbit-admin:ci .

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rabbit-admin-test-reports
          path: rabbit-admin/target/surefire-reports/
