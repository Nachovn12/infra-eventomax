cluster_name = eventomax-mq-prod
# Stable short node names match Compose hostnames and RABBITMQ_NODENAME.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true
# Preserve the existing Classic queue contract; durable does not mean replicated.
default_queue_type = classic
# Importing definitions on a blank node suppresses default user provisioning.
# Provision users and permissions securely before starting application clients.
