name: eventomax-mq

services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-eventomax-rabbitmq}
    hostname: eventomax-rabbitmq
    restart: "no"

    secrets:
      - local_identities

    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.local.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./bootstrap-local.sh:/opt/eventomax/bootstrap-local.sh:ro

    entrypoint: ["/bin/sh", "/opt/eventomax/bootstrap-local.sh"]

    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/eventomax-bootstrap-ready && rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  rabbitmq-data:

secrets:
  local_identities:
    file: ${RABBITMQ_IDENTITIES_FILE:-./.local-secrets/identities.json}
